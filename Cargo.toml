[package]
name = "ci-legacy-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "3.10", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
walkdir = "2"
regex = "1"
once_cell = "1"
anyhow = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
